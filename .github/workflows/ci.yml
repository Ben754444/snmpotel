# build go project
name: Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      - name: Build
        run: go build -v ./...
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          path: ./snmpotel
          name: snmpotel