services:
  snmpotel:
    image: ghcr.io/ben754444/snmpotel:latest
    container_name: snmpotel
    ports:
      - "162:162/udp"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - MIB_MODULES=SNMPv2-MIB,IF-MIB,HP-ICF-MIB
    volumes:
      - ./mibs:/app/mibs

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    command:
      -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - ./loki-data:/var/lib/loki

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
      - "4318:4318"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy

